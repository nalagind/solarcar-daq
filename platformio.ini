; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sdcustom

[env:def]
platform = ststm32
board = genericSTM32F412RE
framework = arduino
lib_deps = 
	greiman/SdFat @ ^2.2.3
	pazi88/STM32_CAN @ ^1.1.2
	jgromes/RadioLib @ ^6.6.0
	stm32duino/STM32duino RTC @ ^1.4.0
	spacehuhn/SimpleCLI @ ^1.1.4
	arkhipenko/TaskScheduler @ ^3.7.0
	; adafruit/Adafruit MLX90614 Library@^2.1.5
debug_tool = stlink
upload_protocol = stlink
monitor_speed = 115200
targets = upload, monitor
build_flags = -DHAL_CAN_MODULE_ENABLED

[env:sdcustom]
platform = ststm32
board = genericSTM32F412RE
framework = arduino
lib_deps = 
	pazi88/STM32_CAN @ ^1.1.2
	jgromes/RadioLib @ ^6.6.0
	stm32duino/STM32duino RTC @ ^1.4.0
	spacehuhn/SimpleCLI @ ^1.1.4
	mikalhart/TinyGPSPlus @ ^1.1.0
	; adafruit/Adafruit MLX90614 Library@^2.1.5
debug_tool = stlink
upload_protocol = stlink
monitor_speed = 115200
targets = upload, monitor
build_flags = -O0
	-D HAL_CAN_MODULE_ENABLED
	-D HSE_VALUE=16000000U
	-D TIMECONSUMER

[env:loratx]
platform = ststm32
board = genericSTM32F412RE
framework = arduino
lib_deps = 
	jgromes/RadioLib @ ^6.6.0
	; adafruit/Adafruit MLX90614 Library@^2.1.5
debug_tool = stlink
upload_protocol = stlink
monitor_speed = 115200
targets = upload, monitor
build_flags = -O0
	-D HSE_VALUE=16000000U
	-D TIMECONSUMER
build_src_filter = +<../test/SX126x_Transmit_Interrupt.cpp>

